group 'com.stockfish'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    compileSdk 35

    defaultConfig {
        minSdk 21
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    lint {
        disable 'InvalidPackage'
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}
